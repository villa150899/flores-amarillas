<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día De Las Flores Amarillas</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --teal-1: #0b3d3a;
    --teal-2: #0f5a55;
    --teal-3: #06282a;
    --yellow: #ffe14d;
    --gold: #f5c542;
    --aqua: #7fdcd0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(160deg, var(--teal-2) 0%, var(--teal-1) 50%, var(--teal-3) 100%);
    background-color: var(--teal-1);
    color: #fff;
    font-family: 'Dancing Script', 'Brush Script MT', cursive, serif;
    overflow: hidden;
    position: relative;
  }

  /* Canvas de partículas y mariposas */
  #fx {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  #confetti {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 20;
  }

  main {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    padding: 4vh 16px 0;
  }

  /* Textos */
  h1 {
    font-family: 'Pacifico', 'Dancing Script', cursive;
    font-weight: 400;
    color: var(--yellow);
    font-size: clamp(1.8rem, 6.2vw, 3.6rem);
    line-height: 1.2;
    text-align: center;
    margin: 0;
    text-shadow: 0 0 12px rgba(255,225,77,.55), 0 0 32px rgba(245,197,66,.35), 0 3px 0 rgba(0,0,0,.25);
    opacity: 0; transform: translateY(-20px);
    animation: enter 1.4s .2s ease forwards;
  }
  .subtitle {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    color: var(--aqua);
    font-size: clamp(1.4rem, 4.5vw, 2.4rem);
    margin: .5rem 0 0;
    text-align: center;
    text-shadow: 0 0 14px rgba(127,220,208,.5);
    opacity: 0; transform: translateY(-14px);
    animation: enter 1.4s .8s ease forwards;
  }
  @keyframes enter { to { opacity: 1; transform: none; } }

  /* Ramo */
  .bouquet-wrap {
    flex: 1; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; animation: enter 1.8s 1.2s ease forwards;
  }
  .bouquet {
    height: 100%; max-height: 640px; width: auto; max-width: 100%;
    aspect-ratio: 400 / 520;
    filter: drop-shadow(0 18px 28px rgba(0,0,0,.45));
    animation: float 6s ease-in-out infinite;
    transform-origin: 50% 90%;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-.8deg) scale(1); }
    50%      { transform: translateY(-10px) rotate(.8deg) scale(1.015); }
  }
  .sunflower { transform-box: fill-box; transform-origin: center; animation: sway 5s ease-in-out infinite; }
  .sunflower:nth-of-type(2) { animation-delay: -1.2s; }
  .sunflower:nth-of-type(3) { animation-delay: -2.4s; }
  .sunflower:nth-of-type(4) { animation-delay: -3.3s; }
  @keyframes sway {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg); }
  }
  .wing { transform-box: fill-box; transform-origin: center; animation: flap .5s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.45); } }

  .fab {
    position: fixed; z-index: 10;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid rgba(255,225,77,.7);
    background: radial-gradient(circle at 30% 30%, #ffe97a, var(--gold));
    color: #5a3a00;
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.4), 0 0 18px rgba(255,225,77,.35);
    transition: transform .2s ease, box-shadow .2s ease;
    opacity: 0; animation: enter 1s 2s ease forwards;
  }
  .fab:hover { transform: scale(1.1); box-shadow: 0 8px 22px rgba(0,0,0,.45), 0 0 26px rgba(255,225,77,.6); }
  .fab:active { transform: scale(.94); }
  .fab:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .fab svg { width: 26px; height: 26px; fill: currentColor; }
  #music { left: 20px; }
  #gift  { right: 20px; }

  .modal {
    position: fixed; inset: 0; z-index: 30;
    display: none; place-items: center;
    background: rgba(3,25,26,.7); backdrop-filter: blur(4px);
    padding: 20px;
  }
  .modal.open { display: grid; }
  .card {
    max-width: 440px; width: 100%;
    background: linear-gradient(160deg, #fff8d6, #ffe98a);
    color: #5a3a00; border-radius: 18px; padding: 30px 26px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
    animation: pop .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.7) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h2 { font-family: 'Pacifico', cursive; font-weight: 400; margin: 0 0 12px; font-size: 1.7rem; color: #b36b00; }
  .card p { font-size: 1.5rem; line-height: 1.35; margin: 0 0 20px; font-weight: 600; }
  .card button {
    font-family: inherit; font-size: 1.25rem; font-weight: 700;
    padding: 8px 26px; border-radius: 999px; border: 0; cursor: pointer;
    background: #0f5a55; color: #ffe14d;
  }
  .card button:hover { background: #0b4844; }

  @media (prefers-reduced-motion: reduce) {
    .bouquet, .sunflower, .wing { animation: none; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<canvas id="confetti"></canvas>

<main>
  <h1>Feliz Día De Las Flores Amarillas</h1>
  <p class="subtitle">Ten tu ramo panzona</p>

  <div class="bouquet-wrap">
    <svg class="bouquet" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramo de girasoles envuelto en papel rosa y morado con lazo dorado">
      <defs>
        <!-- Pétalo -->
        <path id="petal" d="M0,0 C-9,-14 -9,-34 0,-46 C9,-34 9,-14 0,0 Z"/>
        <linearGradient id="petalG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb800"/>
          <stop offset="1" stop-color="#ffe14d"/>
        </linearGradient>
        <radialGradient id="centerG" cx="50%" cy="45%" r="60%">
          <stop offset="0" stop-color="#6b3d17"/>
          <stop offset=".6" stop-color="#3e2210"/>
          <stop offset="1" stop-color="#22110a"/>
        </radialGradient>
        <linearGradient id="paperA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f7b8d6"/>
          <stop offset="1" stop-color="#c79be0"/>
        </linearGradient>
        <linearGradient id="paperB" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e6b1f0"/>
          <stop offset="1" stop-color="#b98ad9"/>
        </linearGradient>
        <linearGradient id="ribbonG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb347"/>
          <stop offset="1" stop-color="#f08a00"/>
        </linearGradient>

        <g id="sf">
          <g fill="url(#petalG)" stroke="#d69a00" stroke-width=".8">
            <use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(20)"/>
            <use href="#petal" transform="rotate(40)"/><use href="#petal" transform="rotate(60)"/>
            <use href="#petal" transform="rotate(80)"/><use href="#petal" transform="rotate(100)"/>
            <use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(140)"/>
            <use href="#petal" transform="rotate(160)"/><use href="#petal" transform="rotate(180)"/>
            <use href="#petal" transform="rotate(200)"/><use href="#petal" transform="rotate(220)"/>
            <use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(260)"/>
            <use href="#petal" transform="rotate(280)"/><use href="#petal" transform="rotate(300)"/>
            <use href="#petal" transform="rotate(320)"/><use href="#petal" transform="rotate(340)"/>
          </g>
          <g fill="#ffd21f" opacity=".9">
            <use href="#petal" transform="rotate(10) scale(.85)"/><use href="#petal" transform="rotate(50) scale(.85)"/>
            <use href="#petal" transform="rotate(90) scale(.85)"/><use href="#petal" transform="rotate(130) scale(.85)"/>
            <use href="#petal" transform="rotate(170) scale(.85)"/><use href="#petal" transform="rotate(210) scale(.85)"/>
            <use href="#petal" transform="rotate(250) scale(.85)"/><use href="#petal" transform="rotate(290) scale(.85)"/>
            <use href="#petal" transform="rotate(330) scale(.85)"/>
          </g>
          <circle r="21" fill="url(#centerG)" stroke="#2a150a" stroke-width="1.5"/>
          <g fill="#8a5a2b" opacity=".75">
            <circle cx="-8" cy="-6" r="1.6"/><circle cx="0" cy="-9" r="1.6"/><circle cx="8" cy="-6" r="1.6"/>
            <circle cx="-11" cy="1" r="1.6"/><circle cx="-3" cy="-1" r="1.6"/><circle cx="4" cy="-1" r="1.6"/><circle cx="11" cy="1" r="1.6"/>
            <circle cx="-8" cy="8" r="1.6"/><circle cx="0" cy="6" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="0" cy="13" r="1.6"/>
          </g>
        </g>

        <path id="leaf" d="M0,0 C22,-16 46,-10 56,6 C40,20 16,16 0,0 Z" fill="#2e8b3d" stroke="#1f6a2c" stroke-width="1.2"/>

        <g id="bfly">
          <g class="wing"><path d="M0,0 C-14,-18 -26,-8 -20,4 C-16,12 -6,10 0,0 Z" fill="#ff7ab8"/></g>
          <g class="wing"><path d="M0,0 C14,-18 26,-8 20,4 C16,12 6,10 0,0 Z" fill="#ff7ab8"/></g>
          <path d="M0,-6 L0,10" stroke="#3a1a3a" stroke-width="2" stroke-linecap="round"/>
        </g>
      </defs>

      <g stroke="#2a8a3a" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M200,330 C190,270 130,230 112,170"/>
        <path d="M200,330 C200,260 200,200 200,120"/>
        <path d="M200,330 C215,270 275,235 292,175"/>
        <path d="M200,330 C180,290 150,290 128,262"/>
        <path d="M200,330 C222,290 250,290 274,258"/>
      </g>

      <use href="#leaf" transform="translate(190 300) rotate(200) scale(1.1)"/>
      <use href="#leaf" transform="translate(212 296) rotate(-20) scale(1.1)"/>
      <use href="#leaf" transform="translate(160 240) rotate(215) scale(.9)"/>
      <use href="#leaf" transform="translate(242 236) rotate(-35) scale(.9)"/>

      <g class="sunflower"><use href="#sf" transform="translate(112 168) scale(.95)"/></g>
      <g class="sunflower"><use href="#sf" transform="translate(292 172) scale(.95)"/></g>
      <!-- Girasol central alto -->
      <g class="sunflower"><use href="#sf" transform="translate(200 108) scale(1.15)"/></g>
      <!-- Girasoles delanteros -->
      <g class="sunflower"><use href="#sf" transform="translate(128 258) scale(.8)"/></g>
      <g class="sunflower"><use href="#sf" transform="translate(274 256) scale(.8)"/></g>

      <g transform="translate(86 140)">
        <path d="M0,0 L-22,-12 L-22,12 Z" fill="url(#ribbonG)"/>
        <path d="M0,0 L22,-12 L22,12 Z" fill="url(#ribbonG)"/>
        <circle r="5" fill="#d97300"/>
      </g>
      <g transform="translate(316 132) scale(1.1) rotate(15)"><use href="#bfly"/></g>
      <g transform="translate(160 62) scale(.8) rotate(-20)"><use href="#bfly"/></g>

      <path d="M70,300 C130,290 270,290 330,300 L262,486 C230,496 170,496 138,486 Z" fill="url(#paperB)" stroke="#a877cf" stroke-width="2"/>
      <path d="M92,296 L200,340 L308,296 L262,486 C230,496 170,496 138,486 Z" fill="url(#paperA)" stroke="#d68bb8" stroke-width="2"/>
      <path d="M200,340 L172,488" stroke="#c98fc4" stroke-width="2" fill="none" opacity=".7"/>
      <path d="M200,340 L228,488" stroke="#c98fc4" stroke-width="2" fill="none" opacity=".7"/>
      <path d="M92,296 C130,310 170,326 200,340" stroke="#ffffff" stroke-width="2.5" fill="none" opacity=".45"/>
      <path d="M308,296 C270,310 230,326 200,340" stroke="#ffffff" stroke-width="2.5" fill="none" opacity=".45"/>
      <g fill="#fff" opacity=".55">
        <circle cx="150" cy="380" r="3"/><circle cx="250" cy="392" r="3"/><circle cx="200" cy="420" r="3"/>
        <circle cx="170" cy="450" r="3"/><circle cx="232" cy="452" r="3"/>
      </g>

      <g transform="translate(200 402)">
        <path d="M0,0 C-30,-30 -74,-30 -70,-2 C-68,24 -30,20 0,0 Z" fill="url(#ribbonG)" stroke="#c96a00" stroke-width="1.5"/>
        <path d="M0,0 C30,-30 74,-30 70,-2 C68,24 30,20 0,0 Z" fill="url(#ribbonG)" stroke="#c96a00" stroke-width="1.5"/>
        <path d="M-6,4 C-24,30 -40,56 -46,86 L-24,78 L-14,96 C-8,64 0,36 6,8 Z" fill="#f59a12" stroke="#c96a00" stroke-width="1.2"/>
        <path d="M6,4 C24,30 40,56 46,86 L24,78 L14,96 C8,64 0,36 -6,8 Z" fill="#ffc94a" stroke="#c96a00" stroke-width="1.2"/>
        <ellipse rx="15" ry="13" fill="#ffc94a" stroke="#c96a00" stroke-width="1.5"/>
        <ellipse cx="-3" cy="-3" rx="6" ry="4" fill="#fff" opacity=".45"/>
      </g>
    </svg>
  </div>
</main>

<button class="fab" id="music" aria-label="Reproducir o pausar música" title="Música">
  <svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  <svg id="icoPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
</button>

<button class="fab" id="gift" aria-label="Abrir dedicatoria" title="Sorpresa">
  <svg viewBox="0 0 24 24"><path d="M20 7h-2.2A3 3 0 0 0 12 4.6 3 3 0 0 0 6.2 7H4a1 1 0 0 0-1 1v3h18V8a1 1 0 0 0-1-1zM9 7a1 1 0 1 1 1 1H9zm6 0v1h-1a1 1 0 1 1 1-1zM4 13v6a1 1 0 0 0 1 1h6v-7zm9 0v7h6a1 1 0 0 0 1-1v-6z"/></svg>
</button>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <h2 id="mTitle">Para ti 🌻</h2>
    <p>Que tu día se llene de luz, alegría y buena suerte. Este ramo de girasoles es para recordarte lo mucho que te aprecio. ¡Ten tu ramo LivLiv!</p>
    <button id="close">De parte de Coquito 🐵</button>
  </div>
</div>

<script>
(() => {
  const fx = document.getElementById('fx');
  const ctx = fx.getContext('2d');
  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = fx.width = innerWidth * dpr;
    H = fx.height = innerHeight * dpr;
    cf.width = W; cf.height = H;
  }
  const cf = document.getElementById('confetti');
  const cctx = cf.getContext('2d');
  addEventListener('resize', resize);
  resize();

  const sparkles = Array.from({ length: 70 }, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 2 + .6,
    s: Math.random() * .0004 + .00008,
    p: Math.random() * Math.PI * 2,
    t: Math.random() * .02 + .008
  }));
  const bflies = Array.from({ length: 5 }, (_, i) => ({
    x: Math.random(), y: Math.random(),
    a: Math.random() * Math.PI * 2,
    sp: .00025 + Math.random() * .0002,
    size: 9 + Math.random() * 6,
    ph: Math.random() * 10,
    col: ['#ffd76a', '#ff9ccb', '#9ff0e2', '#ffe14d', '#f7b8d6'][i]
  }));

  function drawButterfly(b, t) {
    const flap = Math.abs(Math.sin(t * .012 + b.ph));
    const s = b.size * dpr;
    ctx.save();
    ctx.translate(b.x * W, b.y * H);
    ctx.rotate(b.a + Math.PI / 2);
    ctx.fillStyle = b.col;
    ctx.globalAlpha = .75;
    ctx.shadowColor = b.col; ctx.shadowBlur = 10 * dpr;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.scale(side * (.25 + flap * .75), 1);
      ctx.beginPath();
      ctx.ellipse(s * .55, -s * .3, s * .55, s * .8, -.4, 0, Math.PI * 2);
      ctx.ellipse(s * .4, s * .55, s * .38, s * .5, .4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = .9; ctx.shadowBlur = 0; ctx.fillStyle = '#2b1a2b';
    ctx.fillRect(-s * .06, -s * .5, s * .12, s * 1.1);
    ctx.restore();
  }

  function loop(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of sparkles) {
      p.y -= p.s; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      p.p += p.t;
      const a = .25 + .65 * Math.abs(Math.sin(p.p));
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,220,110,${a})`;
      ctx.shadowColor = 'rgba(255,215,90,.9)'; ctx.shadowBlur = 8 * dpr;
      ctx.arc(p.x * W, p.y * H, p.r * dpr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    for (const b of bflies) {
      b.a += (Math.random() - .5) * .08;
      b.x += Math.cos(b.a) * b.sp * 1.6;
      b.y += Math.sin(b.a) * b.sp * 1.6 - .00006;
      if (b.x < -.05) b.x = 1.05; if (b.x > 1.05) b.x = -.05;
      if (b.y < -.05) b.y = 1.05; if (b.y > 1.05) b.y = -.05;
      drawButterfly(b, t);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- Música con Web Audio (melodía suave sintetizada) ---------- */
  const btnMusic = document.getElementById('music');
  const icoPlay = document.getElementById('icoPlay');
  const icoPause = document.getElementById('icoPause');
  let actx = null, master = null, playing = false, timer = null, step = 0;

  // Progresión suave: C - Am - F - G (frecuencias en Hz)
  const chords = [
    [261.63, 329.63, 392.00],
    [220.00, 261.63, 329.63],
    [174.61, 220.00, 261.63],
    [196.00, 246.94, 293.66]
  ];
  const melody = [523.25, 659.25, 587.33, 523.25, 440.00, 523.25, 392.00, 440.00,
                  349.23, 440.00, 523.25, 440.00, 392.00, 493.88, 587.33, 493.88];

  function tone(freq, t0, dur, vol, type = 'sine') {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + .06);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .05);
  }

  function scheduleBar() {
    const now = actx.currentTime + .05;
    const beat = .6;
    const chord = chords[step % chords.length];
    chord.forEach(f => tone(f, now, beat * 4, .05, 'triangle'));
    tone(chord[0] / 2, now, beat * 4, .06, 'sine');
    for (let i = 0; i < 4; i++) {
      const f = melody[(step * 4 + i) % melody.length];
      tone(f, now + i * beat, beat * 1.6, .07, 'sine');
    }
    step++;
  }

const audio = new Audio('flores.mp3');
audio.loop = true;
audio.volume = 0.7;

function startMusic() {
  audio.play();
  playing = true;
  icoPlay.style.display = 'none'; icoPause.style.display = '';
}
function stopMusic() {
  audio.pause();
  playing = false;
  icoPlay.style.display = ''; icoPause.style.display = 'none';
}
  btnMusic.addEventListener('click', () => playing ? stopMusic() : startMusic());

  /* ---------- Confeti + dedicatoria ---------- */
  const modal = document.getElementById('modal');
  let pieces = [], confettiOn = false;
  const colors = ['#ffe14d', '#ffb800', '#ff9ccb', '#c79be0', '#7fdcd0', '#ffffff', '#ff8a3d'];

  function burst() {
    const n = 160;
    for (let i = 0; i < n; i++) {
      const fromLeft = i % 2 === 0;
      pieces.push({
        x: (fromLeft ? 0.12 : 0.88) * W, y: H * .95,
        vx: (fromLeft ? 1 : -1) * (Math.random() * 9 + 3) * dpr,
        vy: -(Math.random() * 16 + 10) * dpr,
        g: .38 * dpr, w: (Math.random() * 8 + 5) * dpr, h: (Math.random() * 5 + 3) * dpr,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: colors[Math.floor(Math.random() * colors.length)],
        life: 1
      });
    }
    if (!confettiOn) { confettiOn = true; requestAnimationFrame(tick); }
  }
  function tick() {
    cctx.clearRect(0, 0, W, H);
    pieces = pieces.filter(p => p.y < H + 40 && p.life > 0);
    for (const p of pieces) {
      p.vy += p.g; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.vy > 0) p.life -= .004;
      cctx.save();
      cctx.translate(p.x, p.y); cctx.rotate(p.rot);
      cctx.globalAlpha = Math.max(p.life, 0);
      cctx.fillStyle = p.c;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cctx.restore();
    }
    if (pieces.length) requestAnimationFrame(tick);
    else { confettiOn = false; cctx.clearRect(0, 0, W, H); }
  }

  document.getElementById('gift').addEventListener('click', () => {
    burst();
    setTimeout(burst, 350);
    modal.classList.add('open');
  });
  document.getElementById('close').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });
})();
</script>
</body>
</html>
